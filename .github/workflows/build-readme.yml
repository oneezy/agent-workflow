name: Build README

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .tmp/readme.zlib.b64
      - .github/workflows/build-readme.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Decode README payload
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import base64
          import zlib

          payload_path = Path('.tmp/readme.zlib.b64')
          if not payload_path.exists():
              raise SystemExit('Missing .tmp/readme.zlib.b64')

          payload = payload_path.read_text(encoding='utf-8').strip()
          content = zlib.decompress(base64.b64decode(payload))
          Path('README.md').write_bytes(content)
          print(f'Wrote README.md ({len(content):,} bytes)')
          PY

      - name: Commit generated README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already current."
            exit 0
          fi

          git commit -m "docs: add complete AI agent workflow guide"
          git push origin HEAD:main
