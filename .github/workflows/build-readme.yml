name: Build README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble README payload
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          parts = sorted(Path('.tmp/readme-parts').glob('*.part'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 README payload parts, found {len(parts)}')

          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          compressed = base64.b64decode(payload, validate=True)
          content = gzip.decompress(compressed)

          expected_sha256 = '1169e435c83be043847b3fd3779915a37cd227438b74ec0813cddc05906b21e4'
          actual_sha256 = hashlib.sha256(content).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'README checksum mismatch: expected {expected_sha256}, got {actual_sha256}'
              )

          Path('README.md').write_bytes(content)
          print(f'Wrote README.md ({len(content):,} bytes, sha256={actual_sha256})')
          PY

      - name: Commit README and remove generator files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp/readme-parts
          rm -f .tmp/readme.zlib.b64
          rm -f .github/workflows/build-readme.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "docs: add complete AI agent workflow guide"
          git push origin HEAD:main
