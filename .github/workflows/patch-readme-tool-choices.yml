name: Patch README Tool Choices

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-readme-tool-choices.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          if "## Tool choice — code editor" in text:
              print("README already patched.")
          else:
              text = text.replace(
                  "10. Run the same bounded workflow inside Docker and Sandcastle.\n11. Start, inspect, or stop approved work remotely through Hermes later.",
                  "10. Evaluate Pi as an optional interactive orchestration layer.\n11. Run the same bounded workflow inside Docker and Sandcastle.\n12. Start, inspect, or stop approved work remotely through Hermes later."
              )

              text = text.replace(
                  "Vite+ still uses pnpm internally. You use `vp`; Vite+ downloads and runs the pinned pnpm version.\n",
                  "Vite+ still uses pnpm internally. You use `vp`; Vite+ downloads and runs the pinned pnpm version.\n\n"
                  "## Tool choice — JavaScript and TypeScript toolchain\n\n"
                  "We are choosing Node with Vite+ because it keeps broad Node ecosystem compatibility while giving agents one consistent command surface for environment management, installation, checking, testing, building, and task execution.\n\n"
                  "1. **Node.js + Vite+ — selected for this lab**\n"
                  "2. Deno — strong integrated runtime and tooling, but changes the runtime and ecosystem assumptions\n"
                  "3. Bun — fast runtime and package manager, but not the compatibility baseline for this workflow\n\n"
                  "## Tool choice — browser testing\n\n"
                  "Playwright is selected because it supports Chromium, Firefox, WebKit, traces, screenshots, videos, headless VPS execution, and deployment smoke testing from one test system.\n\n"
                  "1. **Playwright — selected for this lab**\n"
                  "2. Cypress — mature browser testing with a strong interactive runner\n"
                  "3. WebdriverIO — flexible WebDriver-based automation for broader browser and device setups\n"
              )

              text = text.replace(
                  "This is the only intentionally manual milestone.\n\n## Windows-side prerequisites",
                  "This is the only intentionally manual milestone.\n\n"
                  "## Tool choice — code editor\n\n"
                  "VS Code is selected because it already matches the current workflow, has first-class WSL support, supports GitHub Copilot custom agents and instructions, and can run every CLI in the integrated WSL terminal. The repository remains editor-independent through `AGENTS.md`, Git, scripts, and standard configuration.\n\n"
                  "1. **VS Code — selected for this lab**\n"
                  "2. Zed — compelling for ACP agents, Pi integration, terminal threads, and parallel agent sessions\n"
                  "3. Cursor — AI-first VS Code derivative with built-in agent workflows\n"
                  "4. Windsurf — AI-first editor with integrated coding-agent features\n\n"
                  "Do not switch editors during the initial lab. Re-evaluate Zed after the workflow works reliably in VS Code.\n\n"
                  "## Windows-side prerequisites"
              )

              text = text.replace(
                  "Create a new Codex or Copilot agent session in the repository and give it this prompt:",
                  "## Tool choice — primary coding-agent CLI\n\n"
                  "Codex CLI is the initial coordinator because it is already included with the current ChatGPT plan, works directly in the WSL repository, supports long-running coding work and computer-use tasks, and is supported by Sandcastle. Claude Code and Copilot remain installed as optional specialist workers. Pi is evaluated only after the first successful agent-created PR.\n\n"
                  "1. **Codex CLI — selected as the initial coordinator**\n"
                  "2. Claude Code — strong alternative for planning, architecture, implementation, and review\n"
                  "3. GitHub Copilot CLI — useful alongside VS Code and GitHub-native workflows\n"
                  "4. Pi — minimal extensible harness for model switching, custom tools, extensions, and subagents\n"
                  "5. OpenCode — provider-flexible terminal coding agent and another Sandcastle-supported option\n\n"
                  "The selection is a default, not a lock-in. Shared behavior belongs in `AGENTS.md`, skills, tests, and scripts so the worker can change later.\n\n"
                  "Create a new Codex agent session in the repository and give it this prompt:"
              )

              # Renumber existing milestones before inserting the new Milestone 6.
              for old, new in [(12, 13), (11, 12), (10, 11), (9, 10), (8, 9), (7, 8), (6, 7)]:
                  text = text.replace(f"# Milestone {old} —", f"# Milestone {new} —")

              pi_milestone = '''# Milestone 6 — Evaluate Pi as the interactive orchestration layer

## Goal

Test Pi after the basic coordinator → planner → implementer → reviewer workflow has already produced one clean pull request. Pi is an optional interactive control plane; it does not replace GitHub, CI, Docker, or Sandcastle.

## Tool choice — interactive agent harness

Pi is selected for a bounded evaluation because its minimal core can switch models and gain custom tools, extensions, skills, prompt templates, and subagents without forcing the whole workflow into one vendor-specific product.

1. **Pi — selected for evaluation as the interactive orchestrator**
2. Codex CLI — remains the dependable primary worker and computer-use option
3. Claude Code — remains an optional planning, architecture, implementation, and review worker
4. GitHub Copilot CLI — remains useful for GitHub-native and VS Code-adjacent work

Install the pinned Pi version only for this experiment:

```bash
npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.82.0
pi
```

Use `/login` inside Pi for supported subscription providers. Do not install third-party Pi packages until their source has been reviewed because Pi extensions execute with the user's system permissions.

## Evaluation prompt

Give Pi this task from the repository root:

```text
Act as the interactive coordinator for one small approved GitHub issue.

Read AGENTS.md, CONTEXT.md, the approved specification, and the issue before acting.
Use the existing branch policy and validation command.

Delegate or route work by role when useful:
- planning and architecture
- implementation
- testing
- independent review

Create one feature branch from dev, complete the issue, run vp run validate,
commit, push, and open a pull request into dev. Do not merge.

Use no more than three correction cycles. Stop for secrets, destructive actions,
permission expansion, unresolved architectural decisions, or repeated failures.
Return the PR URL, models or workers used, tests run, time taken, and remaining risks.
```

## Pi versus Sandcastle

```text
Pi
→ interactive conversation, model routing, tools, extensions, and subagents

Sandcastle
→ branch/worktree lifecycle, isolated sandbox, bounded iterations, commits, and PR workflow

Combined
→ Pi can be the agent provider running inside a Sandcastle sandbox
```

After Pi completes one supervised issue, ask Sandcastle to run one documentation-only issue using Pi as the agent provider. Compare Pi with the original Codex run on quality, speed, cost or quota use, steering, logs, and isolation.

## Decision gate

Keep Pi only when it provides a clear improvement. The acceptable outcomes are:

- Promote Pi to the preferred interactive coordinator.
- Keep Pi as an optional specialist harness.
- Remove Pi and continue with Codex, Claude Code, and Copilot.

Do not copy another developer's entire Pi configuration into this repository. Add extensions one at a time and review every source.

> 📺 **Video walkthrough:** [Using Pi to Orchestrate Coding Agents](https://www.youtube.com/watch?v=5Qu2SkSQeBU)

---

'''
              text = text.replace(
                  "# Milestone 7 — Let the agent configure CI and branch policy",
                  pi_milestone + "# Milestone 7 — Let the agent configure CI and branch policy"
              )

              text = text.replace(
                  "Deploy previews, staging, and production without giving an agent permission to publish arbitrary code directly.\n\nVercel automatically creates preview deployments",
                  "Deploy previews, staging, and production without giving an agent permission to publish arbitrary code directly.\n\n"
                  "## Tool choice — deployment platform\n\n"
                  "Vercel is selected for the lab because Git integration, pull-request previews, branch deployments, and production promotion require the least infrastructure work. This lets the lab test deployment gates before taking on VPS administration.\n\n"
                  "1. **Vercel — selected for previews, staging, and production in this lab**\n"
                  "2. Coolify on a VPS — strong later option for self-hosting applications, databases, and supporting services\n"
                  "3. Cloudflare Pages and Workers — strong option for edge-first applications and Cloudflare-native services\n"
                  "4. Netlify — established Git-based preview and deployment platform\n\n"
                  "The repository must not depend permanently on Vercel-specific behavior. Keep builds, tests, environment contracts, and Docker support portable so Coolify or another host can replace Vercel later.\n\n"
                  "Vercel automatically creates preview deployments"
              )

              text = text.replace(
                  "Do not add Sandcastle before the supervised issue-to-PR loop and CI are working.\n\nGive the coordinator:",
                  "Do not add Sandcastle before the supervised issue-to-PR loop and CI are working.\n\n"
                  "## Tool choice — sandbox and orchestration\n\n"
                  "Docker Desktop and Sandcastle are selected together because they solve different parts of the problem: Docker supplies the local Linux sandbox, while Sandcastle manages agents, branches or worktrees, bounded iterations, prompts, commits, and results.\n\n"
                  "1. **Docker Desktop + Sandcastle — selected for the first isolated workflow**\n"
                  "2. Podman + Sandcastle — rootless local-container alternative\n"
                  "3. Vercel Sandbox + Sandcastle — cloud Firecracker microVM option for disposable remote workers\n"
                  "4. A custom Sandcastle sandbox provider — later option for another cloud or internal platform\n\n"
                  "Pi, Codex, Claude Code, Copilot, Cursor, and OpenCode are agent-provider choices inside Sandcastle; Docker, Podman, and Vercel are sandbox-provider choices. Do not treat those two categories as interchangeable.\n\n"
                  "Give the coordinator:"
              )

              text = text.replace(
                  "Keep Hermes on Windows during the local lab. It may call WSL through `wsl.exe`.\n\nAllow only commands such as:",
                  "Keep Hermes on Windows during the local lab. It may call WSL through `wsl.exe`.\n\n"
                  "## Tool choice — remote control\n\n"
                  "Hermes with Discord is selected for the remote-control experiment because it can provide a phone-accessible command surface while the actual coding work remains inside the bounded WSL or VPS worker.\n\n"
                  "1. **Hermes + Discord — selected for the later remote-control milestone**\n"
                  "2. Codex mobile — useful for directly steering Codex sessions without building a separate command layer\n"
                  "3. SSH through Tailscale — simple private administrative access without an AI control plane\n"
                  "4. Zed or another ACP client — useful for organizing remote-compatible agent sessions, but not a replacement for a continuously running worker\n\n"
                  "Allow only commands such as:"
              )

              text = text.replace(
                  "| Sandcastle | 📺 [I Open-Sourced My Own AFK Software Factory](https://www.youtube.com/watch?v=E5-QK3CDVQM) |",
                  "| Pi orchestration | 📺 [Using Pi to Orchestrate Coding Agents](https://www.youtube.com/watch?v=5Qu2SkSQeBU) |\n"
                  "| Sandcastle | 📺 [I Open-Sourced My Own AFK Software Factory](https://www.youtube.com/watch?v=E5-QK3CDVQM) |"
              )

              text = text.replace(
                  'C -. later .-> SC["Sandcastle + Docker"]',
                  'C -. optional interactive layer .-> PI["Pi"]\n  PI -. agent provider .-> SC["Sandcastle + Docker"]\n  C -. later .-> SC'
              )
              text = text.replace(
                  'CLIS["Vite+ • Codex • Claude • Copilot • gh"]',
                  'CLIS["Vite+ • Codex • Claude • Copilot • Pi • gh"]'
              )

              text = text.replace(
                  "- [Sandcastle](https://github.com/mattpocock/sandcastle)\n- [Matt Pocock Skills](https://github.com/mattpocock/skills)",
                  "- [Sandcastle](https://github.com/mattpocock/sandcastle)\n"
                  "- [Pi documentation](https://pi.dev/docs/latest)\n"
                  "- [Pi in Zed through ACP](https://zed.dev/acp/agent/pi)\n"
                  "- [Zed agents](https://zed.dev/docs/ai/agents)\n"
                  "- [Matt Pocock Skills](https://github.com/mattpocock/skills)"
              )

              path.write_text(text, encoding="utf-8")
              print("README patched.")

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-readme-tool-choices.yml
          git add README.md .github/workflows/patch-readme-tool-choices.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: add contextual tool choices and Pi milestone"
          git push origin HEAD:main
