name: Refine README prerequisites

on:
  push:
    branches:
      - docs/ubuntu-26-wsl-prerequisites

permissions:
  contents: write

jobs:
  refine-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: docs/ubuntu-26-wsl-prerequisites
          fetch-depth: 0

      - name: Refine README wording and setup flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "| `@openai/codex` | `0.145.0` | Initial coordinator and primary coding agent |",
                  "| `@openai/codex` | `0.145.0` | WSL CLI execution layer and Sandcastle worker |",
              ),
              (
                  "Agent environment      → Windows Subsystem for Linux\nIntegrated terminal    → WSL\nDefault distribution   → Ubuntu-26.04\nRepository location    → /home/justin/dev/agent-workflow",
                  "Agent environment      → Windows Subsystem for Linux\nIntegrated terminal    → WSL\nWSL default distro     → Ubuntu-26.04\nRepository location    → ~/dev/agent-workflow",
              ),
              (
                  "The agent-environment setting controls where Codex executes its commands. The terminal-shell setting controls only the visible integrated terminal. Keep both on WSL for this repository. Windows applications remain available through normal WSL interoperability when needed.",
                  "The agent-environment setting controls where Codex executes its commands. The terminal-shell setting controls only the visible integrated terminal. Keep both on WSL for this repository. The default distro is configured by Windows WSL, not by Codex. Windows executables can still be invoked through WSL interoperability when needed; use a separate Windows-native Codex session for work that fundamentally depends on Windows system tooling.",
              ),
              (
                  "```bash\ncurl -fsSL https://vite.plus | VP_VERSION=0.2.6 bash\n\nexec \"$SHELL\" -l\n\nvp --version\nvp env setup\nvp env on\nvp env install 24.18.0\nvp env default 24.18.0\nvp env doctor\n```",
                  "```bash\ncurl -fsSL https://vite.plus | VP_VERSION=0.2.6 bash\n```\n\nClose and reopen the WSL shell, then configure and verify Vite+:\n\n```bash\nvp --version\nvp env setup\nvp env on\nvp env install 24.18.0\nvp env default 24.18.0\nvp env doctor\n```",
              ),
              (
                  "2. Codex CLI — remains the dependable primary worker and computer-use option",
                  "2. Codex Desktop and Codex CLI — remain the supervised control surface and portable primary worker",
              ),
              (
                  "Compare Pi with the original Codex run on:",
                  "Compare Pi with the original Codex Desktop and CLI run on:",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/refine-readme-prerequisites.yml

      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/refine-readme-prerequisites.yml
          git commit -m "refine WSL setup guidance"
          git push origin HEAD:docs/ubuntu-26-wsl-prerequisites
